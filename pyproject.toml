[project]
name = "rag-eval"
version = "0.1.0"
description = "RAG 系统评估：混合检索管线（稠密+BM25+RRF+CrossEncoder）+ RAGAS 六指标，源自黑马 LangChain 课 3.4 实践"
requires-python = ">=3.14"
dependencies = [
    "bm25s>=0.3.13",
    "dashscope>=1.25.12",
    "jieba>=0.42.1",
    "langchain>=1.4.6",
    "langchain-community>=0.4.1",
    "langchain-deepseek>=1.0.1",
    "langchain-text-splitters>=1.1.3",
    "openai>=2.15.0",
    "pydantic>=2.11",
    "python-dotenv>=1.2.1",
    "ragas>=0.4.3",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
# scikit-network 在 Windows + Python 3.14 下没有预编译 wheel，ragas 只在测试集生成时用到它，评估用不到
override-dependencies = ["scikit-network; sys_platform == 'never'"]
